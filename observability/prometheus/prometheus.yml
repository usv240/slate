global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/schedule-budget.rules.yml

scrape_configs:
  - job_name: slate-cloud-run
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - slate-delivery-slo-109051079423.us-central1.run.app
        labels:
          service_name: slate
          environment: judging
