[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "slate-delivery-slo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "google-adk[gcp]>=2.7,<2.8",
  "google-genai>=2.12,<3",
  "mcp>=1.26,<2",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "prometheus-client>=0.24,<1",
  "pydantic>=2.12,<3",
  "uvicorn[standard]>=0.41,<0.42",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
