name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Enforce Google-only AI policy
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = ("openai", "anthropic", "mistral", "cohere", "bedrock")
          files = [Path("requirements.txt"), Path("pyproject.toml")]
          found = [word for word in forbidden if any(word in path.read_text(encoding="utf-8").lower() for path in files)]
          if found:
              raise SystemExit(f"Non-permitted AI dependencies: {found}")
          PY
      - name: Test
        # A proof that skips is not a proof. The FFmpeg-dependent scenario tests
        # skip themselves on a machine without FFmpeg, which is right locally and
        # dangerous here: if the install step above ever broke, all nine would
        # skip and this job would still be green.
        env:
          SLATE_REQUIRE_FULL_SUITE: "1"
        run: python -m pytest -q

      - name: Check the page actually initialises in a browser
        # Every unit test can pass while the page is dead. This loads it in
        # headless Chrome and asserts the DOM that only JavaScript can build.
        # It has caught a page-dead bug twice that nothing else would have.
        run: python scripts/check_page.py

      - name: Mutation-check the non-circularity guards
        # Break the classifier on purpose and confirm the guards notice. The
        # first version of one guard passed with the leak present.
        run: python scripts/mutation_check.py
      - name: Compile
        run: python -m compileall -q slate_app
      - name: Validate evidence and dashboard JSON
        run: python -m json.tool docs/LIVE-ACCEPTANCE.json >/dev/null && python -m json.tool observability/grafana/dashboards/slate-delivery.json >/dev/null

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull -t slate:test .
